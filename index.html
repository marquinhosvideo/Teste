<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Orlando 2026 — roteiro da família, períodos, orçamentos e sincronização."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Orlando 2026</title>
    <script>
      ;(function () {
        try {
          var w = window.innerWidth
          var h = Math.max(window.innerHeight, 1)
          document.documentElement.dataset.device = w >= 900 ? 'desktop' : 'mobile'
          document.documentElement.dataset.aspect = w / h >= 1 ? 'landscape' : 'portrait'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
